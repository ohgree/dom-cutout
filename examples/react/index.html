<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the stored theme choice before first paint (theme.ts owns the toggle).
      {
        const theme = localStorage.getItem("dom-cutout-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      }
    </script>
    <link rel="stylesheet" href="../styles.css" />
    <title>dom-cutout — React</title>
    <meta name="description" content="The React adapter over dom-cutout's zero-dependency core." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="dom-cutout — React" />
    <meta
      property="og:description"
      content="The React adapter over dom-cutout's zero-dependency core."
    />
    <meta property="og:url" content="https://ohgree.github.io/dom-cutout/react/" />
    <meta property="og:image" content="https://ohgree.github.io/dom-cutout/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-base-200 font-sans text-base-content antialiased">
    <div id="root"></div>
    <script type="module" src="/react/main.tsx"></script>
  </body>
</html>

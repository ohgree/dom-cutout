<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the stored theme choice before first paint (theme.ts owns the toggle).
      {
        const theme = localStorage.getItem("dom-cutout-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      }
    </script>
    <link rel="stylesheet" href="../styles.css" />
    <title>dom-cutout — vanilla DOM</title>
    <meta
      name="description"
      content="dom-cutout's zero-dependency core on hand-written markup — no framework."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="dom-cutout — vanilla DOM" />
    <meta
      property="og:description"
      content="dom-cutout's zero-dependency core on hand-written markup — no framework."
    />
    <meta property="og:url" content="https://ohgree.github.io/dom-cutout/vanilla/" />
    <meta property="og:image" content="https://ohgree.github.io/dom-cutout/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-base-200 font-sans text-base-content antialiased">
    <main class="mx-auto max-w-2xl px-5 py-6">
      <div class="flex items-center justify-between">
        <a class="text-[13px] text-base-content/60 no-underline hover:text-base-content" href="../"
          >&larr; examples</a
        >
        <button
          id="theme-toggle"
          type="button"
          class="chip cursor-pointer px-2 py-1"
          aria-label="Toggle theme"
        ></button>
      </div>
      <h1 class="mt-2 mb-1 text-2xl font-semibold text-base-content">createCutout() — vanilla DOM</h1>
      <p class="mb-8 text-base-content/60">The zero-dependency core on hand-written markup.</p>
      <div class="demo-card">
        <div class="inline-grid *:[grid-area:1/1]">
          <div id="content">
            <div
              class="flex h-18 w-18 items-center justify-center rounded-full bg-linear-to-br from-indigo-500 to-violet-600 text-2xl font-semibold text-white"
            >
              MJ
            </div>
          </div>
          <!-- hidden until the first mask lands (see main.ts FOUC guard) -->
          <div id="overlay" class="relative" style="visibility: hidden">
            <div
              id="dot"
              class="absolute right-0.5 bottom-0.5 h-4 w-4 rounded-full bg-emerald-500"
            ></div>
          </div>
        </div>
        <!-- Fixed width + left alignment: labels change length on click, and
             resizing buttons would shift the card layout. -->
        <div class="flex flex-col gap-2 *:w-50 *:cursor-pointer *:text-left">
          <button id="toggle-dot" type="button" class="chip">Dot: shown</button>
          <button id="toggle-gap" type="button" class="chip">Gap: 4px</button>
          <button
            id="destroy"
            type="button"
            class="chip disabled:cursor-default disabled:text-base-content/50"
          >
            destroy()
          </button>
        </div>
      </div>
      <div class="mt-3">
        <pre class="code shiki"><code>const instance = createCutout(content, overlay, { gap: 4 });
instance.update(); // after changes ResizeObserver can't see
instance.destroy(); // removes mask + observers</code></pre>
      </div>
    </main>
    <script type="module" src="/vanilla/main.ts"></script>
  </body>
</html>

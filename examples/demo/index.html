<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>dom-cutout — gif capture scene</title>
  </head>
  <body class="bg-slate-100 font-sans text-slate-800 antialiased">
    <!-- Dev-only scene for scripts/record-demo.mjs (not built/deployed).
         The recorder calls window.runDemo() and crops to #scene.
         Finer, higher-contrast checkerboard than .demo-card's: the cutout
         gap must straddle several cells to read as transparency in the
         recorded gif (a thin ring inside one 16px white cell reads as a
         painted border). -->
    <div
      id="scene"
      class="demo-card m-5 inline-flex"
      style="background: repeating-conic-gradient(#dde2e9 0% 25%, #ffffff 0% 50%) 0 0 / 8px 8px"
    >
      <figure class="m-0 text-center">
        <div class="inline-grid *:[grid-area:1/1]">
          <div id="tile-content">
            <div
              class="h-32 w-32 rounded-2xl bg-linear-to-br from-rose-400 via-fuchsia-600 to-indigo-600"
            ></div>
          </div>
          <div id="tile-overlay" class="relative">
            <svg
              id="tile-star"
              viewBox="0 0 24 24"
              class="absolute -right-2 -bottom-2 h-14 w-14 fill-amber-400 stroke-amber-800"
              stroke-width="1.5"
              stroke-linejoin="round"
            >
              <path
                d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
              />
            </svg>
          </div>
        </div>
        <figcaption
          id="tile-caption"
          class="chip mx-auto mt-3 block w-56 text-center tabular-nums text-slate-500"
        >
          shape=contour&ensp;gap: 6px
        </figcaption>
      </figure>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>

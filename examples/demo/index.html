<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>dom-cutout — gif capture scene</title>
  </head>
  <body class="bg-slate-100 font-sans text-slate-800 antialiased">
    <!-- Dev-only scene for scripts/record-demo.ts (not built/deployed).
         No text in the frame. Same hero twice: the left star fakes its gap
         with a background-colored outline painted around the glyph (the
         border workaround, built for the purple opening background); the right one is cut out
         by the library. The choreography swaps the card background
         (purple → white → dark → gradient → checkerboard) — the outline is
         only ever right on the purple it was built for — then sweeps the gap on the right hero. -->
    <div
      id="scene"
      class="demo-card m-5 inline-flex items-center"
      style="background: #ddd6fe; border: 0; padding: 40px 44px; gap: 40px"
    >
      <!-- BEFORE: white outline pretending to be the background. -->
      <div class="inline-grid *:[grid-area:1/1]">
        <div>
          <div
            class="flex h-28 w-28 items-center justify-center rounded-full bg-linear-to-br from-indigo-500 to-violet-600 text-3xl font-semibold text-white"
          >
            MJ
          </div>
        </div>
        <div class="relative">
          <svg
            viewBox="0 0 24 24"
            class="absolute -right-2 -bottom-2 h-12 w-12 overflow-visible"
            stroke-linejoin="round"
          >
            <!-- Outline star behind the artwork, painted in the opening
                 background color: stroke-width 6 in viewBox units ≈ the same
                 visible thickness as the right hero gap 4 (scale-invariant),
                 plus the artwork own 1.5. -->
            <path
              d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
              fill="#fbbf24"
              stroke="#ddd6fe"
              stroke-width="4"
              paint-order="stroke"
            />
            <path
              d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
              fill="#fbbf24"
            />
          </svg>
        </div>
      </div>

      <!-- Drawn arrow (not a text glyph). -->
      <svg
        viewBox="0 0 24 24"
        class="h-10 w-10 stroke-slate-400"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 12h15" />
        <path d="M13 6l6 6-6 6" />
      </svg>

      <!-- AFTER: the library. Same artwork, real hole. -->
      <div class="inline-grid *:[grid-area:1/1]">
        <div id="cut-content">
          <div
            class="flex h-28 w-28 items-center justify-center rounded-full bg-linear-to-br from-indigo-500 to-violet-600 text-3xl font-semibold text-white"
          >
            MJ
          </div>
        </div>
        <div id="cut-overlay" class="relative">
          <svg viewBox="0 0 24 24" class="absolute -right-2 -bottom-2 h-12 w-12 fill-amber-400">
            <path
              d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>dom-cutout — gif capture scene</title>
  </head>
  <body class="bg-slate-100 font-sans text-slate-800 antialiased">
    <!-- Dev-only scene for scripts/record-demo.mjs (not built/deployed).
         The recorder calls window.runDemo() and crops to #scene. -->
    <div id="scene" class="demo-card m-5 inline-flex">
      <figure class="m-0 text-center">
        <div class="inline-grid *:[grid-area:1/1]">
          <div id="avatar-content">
            <div
              class="flex h-24 w-24 items-center justify-center rounded-full bg-linear-to-br from-indigo-500 to-violet-600 text-3xl font-semibold text-white"
            >
              MJ
            </div>
          </div>
          <div id="avatar-overlay" class="relative">
            <div
              id="avatar-dot"
              class="absolute right-1 bottom-1 h-6 w-6 rounded-full bg-emerald-500"
            ></div>
          </div>
        </div>
        <figcaption
          id="avatar-caption"
          class="chip mx-auto mt-2.5 block w-28 text-center text-slate-500"
        >
          dot: shown
        </figcaption>
      </figure>

      <figure class="m-0 text-center">
        <div class="inline-grid *:[grid-area:1/1]">
          <div id="tile-content">
            <div
              class="h-24 w-24 rounded-[16px] bg-linear-to-br from-rose-400 via-fuchsia-600 to-indigo-600"
            ></div>
          </div>
          <div id="tile-overlay" class="relative">
            <svg
              viewBox="0 0 24 24"
              class="absolute -right-1.5 -bottom-1.5 h-11 w-11 fill-amber-400 stroke-amber-800"
              stroke-width="1.5"
              stroke-linejoin="round"
            >
              <path
                d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
              />
            </svg>
          </div>
        </div>
        <figcaption
          id="tile-caption"
          class="chip mx-auto mt-2.5 block w-56 text-center tabular-nums text-slate-500"
        >
          shape=contour&ensp;gap: 6px
        </figcaption>
      </figure>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>

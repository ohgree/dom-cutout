<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark is the product: a tile with a corner badge cut out of it,
       gap ring included — an actual SVG mask, original artwork. -->
  <defs>
    <mask id="cut">
      <rect width="32" height="32" fill="white" />
      <circle cx="25" cy="25" r="9.5" fill="black" />
    </mask>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="#6366f1" mask="url(#cut)" />
  <circle cx="25" cy="25" r="6" fill="#fbbf24" />
</svg>
